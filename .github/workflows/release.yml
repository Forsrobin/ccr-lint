# Cuts a release with ccr-lint itself: picks the next version from the commits since the last tag
# (fix -> patch, feat -> minor, breaking -> major; one level lower before 1.0.0), updates Cargo.toml,
# Cargo.lock and CHANGELOG.md, commits `chore(release): X.Y.Z`, tags vX.Y.Z, pushes to main and
# publishes to crates.io.
#
# Run it from the Actions tab (Release -> Run workflow). Needs the CARGO_REGISTRY_TOKEN secret.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: "Force major, minor, patch or an exact version (leave empty to derive it from the commits)"
        required: false
        default: ""
      dry-run:
        description: "Only preview the version and changelog"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history and tags, to find the last release

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Install ccr-lint
        run: cargo install ccr-lint --locked

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, write changelog, commit and tag
        env:
          RELEASE_AS: ${{ inputs.release-as }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ -n "$RELEASE_AS" ]; then args+=(--release-as "$RELEASE_AS"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          ccr-lint release "${args[@]}"

      - name: Check the package
        if: ${{ !inputs.dry-run }}
        run: cargo publish --locked --dry-run

      - name: Push the release commit and tag
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags origin HEAD:main

      - name: Publish to crates.io
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Summary
        if: ${{ !inputs.dry-run }}
        run: |
          version=$(git describe --tags --abbrev=0)
          echo "Released [$version](https://crates.io/crates/ccr-lint/${version#v}) :rocket:" >> "$GITHUB_STEP_SUMMARY"
