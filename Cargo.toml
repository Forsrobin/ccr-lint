[package]
name = "ccr-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Conventional Commits linting and releases for Rust projects, without Node: a faithful port of commitlint (config-conventional) and commit-and-tag-version (conventionalcommits preset)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Forsrobin/ccr-lint"
keywords = ["conventional-commits", "commitlint", "changelog", "release", "semver"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "ccr-lint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.20"
icu_collator = "2.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
as_conversions = "warn"
